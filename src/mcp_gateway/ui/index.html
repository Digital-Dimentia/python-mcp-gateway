<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCP Gateway</title>
<link rel="stylesheet" href="style.css">
<!-- Blocking, and in the head: the attribute has to be on <html> before the first paint. -->
<script src="theme.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>&#128268;</text></svg>">
</head>
<body>

<header class="bar">
  <h1>MCP Gateway</h1>

  <!-- The configured servers themselves, one button each. The button carries only the
       indicator and the name; everything else about the server -- what it is, and what you
       can do to it -- is in the menu it drops. -->
  <nav class="servers" id="servers" aria-label="Servers"></nav>

  <button type="button" id="btn-add-server" class="ghost" title="Add a server to servers.yaml">+ Add</button>
  <span class="theme-label" aria-hidden="true">Theme:</span>
  <button type="button" id="btn-theme" class="ghost theme"><span id="theme-icon" aria-hidden="true"></span></button>
</header>

<!-- Shown until both sockets are up, or when the key is wrong. -->
<section id="gate" class="gate" hidden>
  <form id="gate-form">
    <h2>Access key required</h2>
    <p id="gate-message">This gateway is protected by an access key.</p>
    <label>Key <input type="password" id="gate-key" autocomplete="off" spellcheck="false"></label>
    <button type="submit">Connect</button>
  </form>
</section>

<main class="columns">

  <!-- ── Left: the selected server's primitives ──────────────────────── -->
  <section class="col col-primitives" aria-label="Primitives">
    <div class="col-head">
      <h2 id="primitives-title">Primitives</h2>
      <input type="search" id="filter" placeholder="Filter…" spellcheck="false">
    </div>
    <nav class="tabs" id="tabs">
      <button type="button" data-kind="tools" class="on">Tools <span class="count" data-count="tools">0</span></button>
      <button type="button" data-kind="prompts">Prompts <span class="count" data-count="prompts">0</span></button>
      <button type="button" data-kind="resources">Resources <span class="count" data-count="resources">0</span></button>
      <button type="button" data-kind="templates">Templates <span class="count" data-count="templates">0</span></button>
    </nav>
    <ul class="primitives" id="primitives"></ul>
    <div class="detail" id="detail"></div>
  </section>

  <!-- The edge between two columns, and the control that moves it: a `separator` with a
       tabindex is a window splitter, so the arrows nudge it and Home puts it back. -->
  <div class="gutter" data-gutter="0" role="separator" aria-orientation="vertical"
       tabindex="0" aria-label="Resize the primitives and results columns"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="45"
       title="Drag to resize — double-click to reset"></div>

  <!-- ── Middle: what came back ──────────────────────────────────────── -->
  <section class="col col-results" aria-label="Results">
    <div class="col-head">
      <h2>Results</h2>
      <button type="button" id="btn-clear-results" class="ghost">Clear</button>
    </div>
    <div class="results" id="results">
      <p class="empty">Invoke a tool, get a prompt, or read a resource.</p>
    </div>
  </section>

  <div class="gutter gutter-vars" data-gutter="1" role="separator" aria-orientation="vertical"
       tabindex="0" aria-label="Resize the results and variables columns"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="47"
       title="Drag to resize — double-click to reset"></div>

  <!-- ── Right: the values the server publishes for its own parameters ─ -->
  <section class="col col-variables" aria-label="Variables">
    <div class="col-head">
      <h2>Variables</h2>
      <button type="button" id="btn-vars-refresh" class="ghost" title="Re-read every vocabulary">Reread</button>
    </div>
    <p class="vars-note" id="vars-note" hidden></p>
    <div class="variables" id="variables"></div>
  </section>

</main>

<!-- The log, parked behind the footer. The tab at the footer's left edge raises it. -->
<div id="log-drawer" class="drawer" role="region" aria-label="Log">
  <div class="drawer-head">
    <h2>Log</h2>
    <label>Level
      <select id="log-level">
        <option value="DEBUG">debug</option>
        <option value="INFO" selected>info</option>
        <option value="WARNING">warning</option>
        <option value="ERROR">error</option>
      </select>
    </label>
    <button type="button" id="btn-log-clear" class="ghost">Clear</button>
  </div>
  <ol class="log" id="log"></ol>
</div>

<!-- Three groups: where the gateway is listening, what it is, and what you can do to it. -->
<footer class="bar bar-foot">

  <!-- Left: the log tab, then the sockets, each pill wearing the address it answers on
       and the number of clients attached to it. -->
  <div class="bar-side">
    <button type="button" id="btn-log" class="tab" aria-expanded="false" aria-controls="log-drawer">
      Log <span class="count" id="log-count">0</span>
    </button>
    <span class="pill" id="pill-mcp" data-state="closed">
      <span class="pill-addr" data-addr>…</span>/mcp<span class="pill-count" data-count>0</span>
    </span>
    <span class="pill" id="pill-admin" data-state="closed">
      <span class="pill-addr" data-addr>…</span>/admin<span class="pill-count" data-count>0</span>
    </span>
  </div>

  <!-- Centre: what this gateway is. -->
  <span class="bar-meta" id="bar-meta"></span>

  <!-- Right: the two files, each next to the action that re-reads it. -->
  <div class="bar-side bar-actions">
    <span class="bar-field" id="env-field" hidden>env <span class="bar-file" id="env-file"></span></span>
    <!-- The button names the file it re-reads; app.js fills the name in from admin.status. -->
    <button type="button" id="btn-reload" class="ghost" title="Re-read the config and env files">Reload <span class="bar-file" id="reload-file">config</span></button>
    <button type="button" id="btn-refresh" class="ghost" title="Refetch every listing">Refresh</button>
  </div>
</footer>

<!-- The server editor, opened from a server's menu in the header, or from + Add. -->
<dialog id="server-dialog">
  <form method="dialog" id="server-form"></form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
