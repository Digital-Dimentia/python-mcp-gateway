[package]
name = "mcp-gateway-desktop"
version = "0.1.0"
description = "The desktop shell for python-mcp-gateway: one app, the gateway and its admin UI"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
# Named apart from the package so `main.rs` can depend on it and the unit tests can run
# without a window. Everything worth testing lives in the library; `main.rs` is four lines.
name = "mcp_gateway_desktop"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
# `connect` and `handshake` only. No TLS feature of any kind: the one address this process
# ever dials is 127.0.0.1, and a TLS stack here would be dead weight in the binary and one
# more thing for the notarisation bead to sign.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
base64 = "0.22"
thiserror = "2"

# Orphan control is the one thing that cannot be written once for every platform, so each
# platform brings its own primitive and nothing else. See the module docs in `supervisor.rs`.

# `setpgid`/`killpg` on both, `prctl(PR_SET_PDEATHSIG)` on Linux only. Also the `0600` on
# `gateway.env` and the `/proc` lookup that decides whether a leftover pid is ours.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# A Job Object with `KILL_ON_JOB_CLOSE`, which is what Windows has instead of a process
# group -- and which covers the Force Quit case a pidfile exists for on Unix.
#
# `windows-sys` gates *functions*, not only modules, and it gates them on every feature their
# signature reaches into. `CreateJobObjectW` takes a `SECURITY_ATTRIBUTES`, so it is absent
# from a `Win32_System_JobObjects` that was enabled without `Win32_Security` -- and absent
# reads as a typo: the compiler suggests `CreateJobSet`. Hence the feature below that no line
# of this crate names.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
# A shipped app, so trade build time for size and speed. `panic = "abort"` is deliberate:
# the supervisor's teardown runs from Tauri's exit event, not from unwinding, and a panic
# that limped on would be a panic with a live child process attached.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
