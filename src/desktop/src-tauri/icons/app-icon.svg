<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The app icon: src/mcp_gateway_ui/logo.svg, the web favicon, on a tile. The mark is
       copied verbatim and tests/test_desktop_layout.py holds the two copies equal, so the
       Dock and the browser tab cannot drift apart. The tile is what the favicon does not
       need and a Dock icon does: macOS draws every app on the same 824 unit rounded square
       inside a 1024 canvas, and bare line art beside them reads as a missing icon.
       Regenerate the raster set with `make tauri-icons` after changing either file. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#f4faf8"/>
  <g transform="translate(192 192) scale(20)">
  <g fill="none" stroke="#2f8f77" stroke-width="2.2" stroke-linecap="round">
    <path d="M5 16 H14"/>
    <path d="M14 16 L26 7"/>
    <path d="M14 16 H26"/>
    <path d="M14 16 L26 25"/>
  </g>
  <g fill="#2f8f77">
    <circle cx="14" cy="16" r="4.4"/>
    <circle cx="4.6" cy="16" r="2.4"/>
    <circle cx="26.6" cy="7" r="2.4"/>
    <circle cx="26.6" cy="16" r="2.4"/>
    <circle cx="26.6" cy="25" r="2.4"/>
  </g>
  </g>
</svg>
