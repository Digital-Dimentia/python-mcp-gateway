[package]
name = "mcp-gateway-desktop"
version = "0.1.0"
description = "The desktop shell for python-mcp-gateway: one app, the gateway and its admin UI"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
# Named apart from the package so `main.rs` can depend on it and the unit tests can run
# without a window. Everything worth testing lives in the library; `main.rs` is four lines.
name = "mcp_gateway_desktop"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
# `connect` and `handshake` only. No TLS feature of any kind: the one address this process
# ever dials is 127.0.0.1, and a TLS stack here would be dead weight in the binary and one
# more thing for the notarisation bead to sign.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
base64 = "0.22"
libc = "0.2"
thiserror = "2"

[profile.release]
# A shipped app, so trade build time for size and speed. `panic = "abort"` is deliberate:
# the supervisor's teardown runs from Tauri's exit event, not from unwinding, and a panic
# that limped on would be a panic with a live child process attached.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
