# The gateway as the far end of remote mode, in a container, on the Linux box.
#
#   laptop: desktop app / ssh -N -L 8765:127.0.0.1:8765 you@box
#                      |
#   box:    127.0.0.1:8765  <- gateway (host network, loopback, no key)
#                      |  url: http://127.0.0.1:<port>/mcp
#           127.0.0.1:<port> <- each MCP server, a container publishing on loopback
#
# Why host networking and not `ports:`. Remote mode is a keyless daemon on loopback, and SSH
# is the authentication. On a bridge network the daemon has to bind 0.0.0.0 inside its
# container to be reachable through a published port at all, and the daemon refuses an
# unauthenticated bind off loopback, so it would demand an access key that the desktop app,
# in remote mode, does not send. With host networking the container's 127.0.0.1 *is* the
# box's, so the ssh forward lands on it exactly as it would on the systemd unit.
#
# Linux only: Docker Desktop's host networking is not the host's.
#
#   docker load -i python-mcp-gateway-container.tar   # from `make container-image`
#   # or, in a checkout on the box: docker build -f Containerfile -t python-mcp-gateway:local .
#   cp config/gateway.env.example config/gateway.env && $EDITOR config/gateway.env
#   docker compose up -d
#   curl http://127.0.0.1:8765/ui/                   # on the box: is it up?

services:
  gateway:
    image: python-mcp-gateway:local
    network_mode: host
    # Write ./config as the account that owns it. The image already drops to uid 1000, which
    # is right on a single-user box and wrong everywhere else -- a save from the admin UI
    # would leave servers.yaml owned by a uid that cannot open it here. `.env` beside this
    # file carries the real numbers; see step 2 of README.md. The defaults are the image's
    # own, so `docker compose up` without an `.env` behaves exactly as the image does.
    user: "${MCPGW_UID:-1000}:${MCPGW_GID:-1000}"
    environment:
      MCP_GATEWAY_HOST: 127.0.0.1
      MCP_GATEWAY_PORT: "8765"
    volumes:
      # A directory, writable: the admin UI saves servers.yaml by writing a new file and
      # renaming it over the old one, which a single bind-mounted file cannot take.
      - ./config:/config
    restart: unless-stopped

  # A real backend to check the arrangement against, before you have one of your own. It is
  # the schema zoo -- 14 tools, 6 prompts, 8 resources, every JSON Schema construct -- put
  # behind a URL by `examples/zoo_http.py`, which is what a `url:` backend looks like from
  # the inside. Same image as the gateway: it carries Python, and the zoo needs nothing else.
  #
  # Behind a profile, so `docker compose up -d` never starts it and a deployment that has
  # graduated to real servers does not carry a test fixture. See "Check it end to end" in
  # README.md, which is also where the two files under ./zoo come from.
  zoo:
    image: python-mcp-gateway:local
    profiles: ["verify"]
    network_mode: host
    user: "${MCPGW_UID:-1000}:${MCPGW_GID:-1000}"
    # The image's entrypoint is the daemon; this container runs a different program from
    # the same image, so the entrypoint is replaced rather than argued with.
    entrypoint: ["python3"]
    command: ["/opt/zoo/zoo_http.py"]
    environment:
      MCP_ZOO_HTTP_HOST: 127.0.0.1
      MCP_ZOO_HTTP_PORT: "9001"
    volumes:
      - ./zoo:/opt/zoo:ro
    restart: unless-stopped

  # The same wrapper, a different child: a backend that ships its own control surface, so
  # the admin UI has a panel to draw rather than only the capability to draw one. Its own
  # port, because each backend publishes on a loopback port of its own.
  panel:
    image: python-mcp-gateway:local
    profiles: ["verify"]
    network_mode: host
    user: "${MCPGW_UID:-1000}:${MCPGW_GID:-1000}"
    entrypoint: ["python3"]
    command: ["/opt/zoo/zoo_http.py", "--server", "/opt/zoo/panel_server.py"]
    environment:
      MCP_ZOO_HTTP_HOST: 127.0.0.1
      MCP_ZOO_HTTP_PORT: "9002"
    volumes:
      - ./zoo:/opt/zoo:ro
    restart: unless-stopped

  # One MCP server that speaks Streamable HTTP. Replace the image and its port with yours;
  # anything that serves MCP over HTTP on a path works. Published on 127.0.0.1 only: the
  # gateway is the one thing on this box that should talk to it, and a port on the LAN
  # would be a way around every credential rule in gateway.env.
  #
  # search:
  #   image: your-registry/search-mcp:latest
  #   ports:
  #     - "127.0.0.1:9001:8000"
  #   restart: unless-stopped
