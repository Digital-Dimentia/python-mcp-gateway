name: Desktop shell

# Its own workflow, and deliberately not a leg of `ci.yml`.
#
# `ci.yml` is the daemon: three Python versions on Linux, no Rust toolchain, no webview.
# The daemon is the product and it ships without the app, so a checkout with no Rust at all
# must still run the whole Python suite -- and adding Rust to that matrix would make every
# interpreter leg pay for a toolchain none of them use.
#
# What this workflow is for is the code no single developer's machine can compile: the
# Windows Job Object and the Linux `PDEATHSIG` in `supervisor.rs`, the `/proc` lookup in
# `appdata.rs`, the `cfg`-gated halves of `pathenv.rs`. A macOS developer cannot reach any
# of it, and code that is never built is code that does not work.
#
# It builds no installer: that is `publish-artifacts.yml`, which runs on a release, or by hand
# as a rehearsal. This one compiles, lints and tests, which is the part worth knowing about on
# every push.
#
# It does build the bundled interpreter, and not only because `tauri-build` validates
# `bundle.resources` at compile time and will not build the crate without it. With the
# interpreter present, the three integration tests run instead of skipping -- a real gateway
# spawned from the bundle, `/admin` opened through the proxy with a Bearer header,
# `admin.status` round-tripped, teardown confirmed. On Linux and Windows that is a far
# stronger statement than `clippy` passing: it is the new orphan control actually reaping a
# real process tree.

# `scripts/bundle_python.py` is on the list because `make tauri-python` *is* that script, and
# it is the one file here whose platform branches only ever execute on a runner. A fix to its
# Windows half once merged without this workflow running at all, so the only Windows evidence
# on record was the failure it fixed.
#
# The path list is written twice because GitHub Actions does not support YAML anchors. Keep
# the two copies identical.
on:
  push:
    branches: ["**"]
    paths:
      - "src/desktop/**"
      - "scripts/stage_ui.py"
      - "scripts/bundle_python.py"
      - "src/mcp_gateway_ui/**"
      - "Makefile"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "src/desktop/**"
      - "scripts/stage_ui.py"
      - "scripts/bundle_python.py"
      - "src/mcp_gateway_ui/**"
      - "Makefile"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  check:
    name: tauri-check (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos
            python: python3
          - os: ubuntu-22.04
            label: linux
            python: python3
          - os: windows-latest
            label: windows
            # `setup-python` is not required to put a `python3` on PATH on Windows, and the
            # Makefile's default is `python3`. One variable rather than a second Makefile.
            python: python
    defaults:
      run:
        shell: bash
    env:
      PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      # `make tauri-check` stages the UI when nothing is staged, and that is a Python
      # script: `tauri::generate_context!` embeds the frontend at compile time and refuses
      # to build without it.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # How `bundle_python.py` fetches the standalone interpreter. Not a second dependency
      # on a second thing -- uv's managed builds *are* python-build-standalone.
      - uses: astral-sh/setup-uv@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/desktop/src-tauri

      - name: Install the Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      # The runner image is not guaranteed to carry GNU make, and the check is a make target
      # on purpose. Ten seconds to remove the question.
      - name: Install make
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make --no-progress -y

      # The interpreter the app ships: a python-build-standalone build with the freshly
      # built wheel installed into it, stripped and verified. Required before the check --
      # `tauri-build` refuses to compile a crate whose `bundle.resources` are not on disk --
      # and what turns the three integration tests from skipped into run.
      - run: make tauri-python

      # cargo fmt --check, clippy -D warnings, cargo test.
      - run: make tauri-check
