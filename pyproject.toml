[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-mcp-gateway"
version = "0.1.0"
description = "An MCP gateway daemon: one WebSocket MCP server, many stdio backends, one credential store"
readme = "README.md"
license = { file = "LICENSE" }
# The floor, the classifiers below, the CI matrix, and the Containerfile base image move
# in lockstep. A matrix leg is the only thing that checks the claim a classifier makes,
# so dropping one alone turns a tested statement into an untested one.
requires-python = ">=3.12,<3.15"
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

# Runtime dependencies are exact pins. They are protocol surface, not conveniences:
# upgrades are deliberate, reviewed, single-purpose commits, never a resolver's choice at
# install time.
#
# `ruamel.yaml` is here because `servers.yaml` is YAML and there is no YAML parser in the
# stdlib. It is a 118 KiB pure-Python wheel with zero hard dependencies. Take it plain:
# **never the `libyaml` or `oldlibyaml` extras**, which are the only things that pull
# `ruamel.yaml.clib`, a C extension that would reintroduce a per-architecture wheel into a
# release build that targets linux/amd64 *and* linux/arm64. Use `YAML(typ="safe", pure=True)`.
#
# A YAML 1.2 safe loader reads JSON, so `--config servers.json` works through the identical
# code path with no extra branch. That is why there is no `tomllib` alternative here.
#
# `websockets` is the client-facing transport. Deliberately not starlette/uvicorn: this
# process serves one protocol on one port and needs no ASGI stack, and the `mcp` SDK's
# dependency tree (pydantic, starlette, uvicorn, sse-starlette, httpx2, pyjwt[crypto])
# would put two Rust-compiled per-arch extensions into a process that proxies raw dicts.
#
# That decision was tested when MCP's Streamable HTTP transport was added, which needs the
# two things an ASGI stack exists to provide: a real HTTP server and an SSE writer. It held.
# `transport_http.py` is a request reader, a response writer and an SSE writer, `websockets`
# still owns the socket, and the dependency list is unchanged. See
# `src/mcp_gateway/transport_http.md` for how the port is shared.
dependencies = [
  "ruamel.yaml==0.19.1",
  "websockets==17.0.1",
]

[project.optional-dependencies]
# Dev deps mix pins and floors: pin what produces artifacts or enforces style (a ruff bump
# rewrites the diff of every file it touches), float what only has to be new enough.
dev = [
  "build==1.2.2",
  "packaging>=24.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.0.0",
  "ruff==0.6.9",
]

[project.scripts]
mcp-gateway = "mcp_gateway.cli:run"
mcp-gateway-connect = "mcp_gateway.bridge:run"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
# `src/desktop` is the Tauri shell, not a Python package. It has no `__init__.py`, so
# discovery would skip it today -- but only by luck: `src-tauri` and `.staging` are
# rejected as identifiers, and that is the whole of what keeps the ~58 MB of bundled
# CPython under `resources/python/` (which is full of `__init__.py`) out of the wheel.
# Saying it out loud costs one line and removes the accident.
exclude = ["desktop*"]

# The admin UI's assets. `mcp_gateway_ui` is a package (it has an `__init__.py`) purely so
# these files ship in the wheel and `importlib.resources` can find them there exactly as
# it does in a checkout -- see webui.md. `tests/test_webui.py` asserts they are in the built
# wheel, because "works from the repo, 404s from pip install" is the failure this invites.
#
# It is discovered by the `find` above as a *top-level* package beside `mcp_gateway`, not
# as a subpackage of it: the daemon is Python and the UI is not, and the directory name and
# the import name have to agree for one `resources.files()` call to work both from `src` on
# `sys.path` and from `site-packages`. The `mcp_gateway_` prefix is what shipping at the top
# level costs -- a bare `ui` in `site-packages` is a name another distribution will claim.
[tool.setuptools.package-data]
# `*.svg` is the stock mark, which is package data for the same reason the stylesheet is:
# the page ships everything it loads. See src/mcp_gateway/branding.md.
"mcp_gateway_ui" = ["*.html", "*.css", "*.js", "*.svg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
# Paired with the subprocess-leak guard in tests/conftest.py: a child process collected
# without being closed raises in __del__, and unraisable exceptions are invisible by
# default. This project's whole job is owning subprocesses, so that must be a failure.
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
